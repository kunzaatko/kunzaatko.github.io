{% extends "layout.html" %}
{% block page %}
<section id="{{ page.title | striptags }}" class="white">
  <div class="w-100 mw-none ph3 mw9-m mw9-l center f3">
    <header>
      <h2>{{ page.title | safe }}</h2>
      <div class="highlight mt2 mb3"></div>
    </header>
    <div class="about">
      {{ page.content | safe }}
    </div>
  </div>
</section>
{% endblock page %}
