{% extends "base.html" %}

{% block top %}
<header>Tags</header>
<small> {{ terms | length }} tags in total </small> <!-- FIX: This should be done in css <21-03-24> -->
<br />
<small>
	<ul class="tags">
		{% for tag in terms %}
		<li><a class="tag" href="{{ get_taxonomy_url(kind='tags', name=tag.name) }}">{{ tag.name }}</a></li>
		{% endfor %}
	</ul>
</small>
{% endblock %}

{% block content %}
{% endblock content %}
