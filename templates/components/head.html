<head>
	<meta charset="UTF-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=edge" />

	<meta name="description" content="{{ config.description }}" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta name="theme-color" content="{{ config.extra.primary_color }}" />
	<link rel="canonical" href="{{ current_url | default(value='/') }}" />

	<title>
		{%- if page.title -%}
		{{- page.title }} - {{ config.title -}}
		{%- elif section.title -%}
		{{- section.title }} - {{ config.title -}}
		{%- else -%}
		{{- config.title -}}
		{%- endif -%}
	</title>

	<!-- Style -->
	<link rel="stylesheet" type="text/css" href="{{ get_url(path='style.css') }}" />

	<!-- Icons -->
	<link rel="stylesheet" type="text/css" href="{{ get_url(path='icons/fontawesome.css') }}" />
	<link rel="stylesheet" type="text/css" href="{{ get_url(path='icons/brands.css') }}" />
	<link rel="stylesheet" type="text/css" href="{{ get_url(path='icons/solid.css') }}" />

	<!-- FIX:  <kunzaatko> -->
	<!-- <link rel="stylesheet" type="text/css" href="/syntax-theme-dark.css" media="(prefers-color-scheme: dark)" /> -->
	<!-- <link rel="stylesheet" type="text/css" href="/syntax-theme-light.css" media="(prefers-color-scheme: light)" /> -->


	{% if config.extra.animated_favicon %}
	<link rel="icon" type="image/gif" href="{{ get_url(path='resources/favicon_dice.gif') }}" />
	{% elif config.extra.static_favicon %}
	<!-- NOTE: `.ico` graphic is larger so prefer `.svg` -->
	<link rel="icon" type="image/svg+xml" href="{{ get_url(path='resources/favicon_dice.svg') }}" />
	{% endif %}

	<!-- NOTE: Icon that apple users see when saving site to home screen -->
	<link rel="apple-touch-icon" sizes="180x180" href="{{ get_url(path='resources/apple_touch_icon_dice.png') }}" />

	<!-- TODO: Add more rel="me" attributes <19-03-24> -->
	<link rel="me" href="https://github.com/kunzaatko" />

	<!-- Open Graph -->
	<!-- NOTE: It determines the details that are shared on a social media card if the link is posted... https://ahrefs.com/blog/open-graph-meta-tags/  -->
	<meta property="og:site_name" content="{{ config.title }}" />
	<meta property="og:title"
		content="{%- if page.title -%}{{- page.title }} - {{ config.title -}}{%- elif section.title -%}{{- section.title }} - {{ config.title -}}{%- else -%}{{- config.title -}}{%- endif -%}" />
	<meta property="og:url" content="{{ current_url | default(value='/') }}" />
	<meta property="og:description" content="{{ page.description | default(value=config.description) }}" />
	<meta property="og:image" content="{{ get_url(path='resources/og_image.png') }}" /> <!-- FIX: Should be determined by the page and
not the global config or static <20-03-24> -->
	<meta property="twitter:card" content="summary_large_image" />

	{% block analytics %}
	{% if config.extra.analytics.google %}
	<script async src="https://www.googletagmanager.com/gtag/js?id={{ config.extra.analytics.google }}"></script>
	<script type="text/javascript">
		window.dataLayer = window.dataLayer || [];
		function gtag() {
			dataLayer.push(arguments);
		}
		gtag("js", new Date());
		gtag("config", "{{ config.extra.analytics.google }}");
	</script>
	{% endif %}
	{% endblock analytics %}


	{% block katex %}
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.7/dist/katex.min.css"
		integrity="sha384-3UiQGuEI4TTMaFmGIZumfRPtfKQ3trwQE2JgosJxCnGmQpL/lJdjpcHkaaFwHlcI" crossorigin="anonymous">
	<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.7/dist/katex.min.js"
		integrity="sha384-G0zcxDFp5LWZtDuRMnBkk3EphCK1lhEf4UEyEM693ka574TZGwo4IWwS6QLzM/2t"
		crossorigin="anonymous"></script>
	<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.7/dist/contrib/auto-render.min.js"
		integrity="sha384-+VBxd3r6XgURycqtZ117nYw44OOcIax56Z4dCRWbxyPt0Koah1uHoK0o4+/RRE05"
		crossorigin="anonymous"></script>
	<script>
		document.addEventListener("DOMContentLoaded", function () {
			renderMathInElement(document.body, {
				delimiters: [
					{left: '$$', right: '$$', display: true},
					{left: '$', right: '$', display: false},
					{left: '\\(', right: '\\)', display: false},
					{left: '\\[', right: '\\]', display: true}
				],
				throwOnError: false
			});
		});
	</script>
	{% endblock katex %}

</head>

<!-- vim: set formatoptions= -->
