<!-- TODO: Add a collapsed flag to make the note collapsed in `<details>` by default <02-09-25> -->
<blockquote class="callout note">
    {% set icon = load_data(path="static/icons/note.svg") %}
    <div class="icon">
        {{ icon | safe }}
    </div>
    <div class="content">
        {% if header %}
        <p><strong>{{ header }}</strong></p>
        {% endif %}
        {{ body | markdown | safe }}
    </div>
</blockquote>
